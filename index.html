<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>田 · 档案之野 — The Field Archive</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='6' y='6' width='52' height='52' rx='8' fill='%23f5f4ee' stroke='%2326241c' stroke-width='4'/%3E%3Ctext x='32' y='45' font-size='34' text-anchor='middle' font-family='serif' fill='%2326241c'%3E田%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 加载页 -->
<div id="loader">
  <div class="loader-cards" id="loaderCards"></div>
  <div class="loader-seal">田</div>
  <div class="loader-text">Loading<span class="dots"><i>.</i><i>.</i><i>.</i></span></div>
  <div class="loader-sub" id="loaderSub">正在开垦档案之野</div>
</div>

<!-- 画布 -->
<canvas id="field"></canvas>

<!-- 晕影 -->
<div id="vignette"></div>

<!-- 左上角标识 -->
<header id="brand">
  <div class="seal">田</div>
  <div class="brand-text">
    <h1>档案之野</h1>
    <p>THE FIELD ARCHIVE</p>
  </div>
</header>

<!-- 右上角计数 -->
<div id="counter">208 条档案 · 四个系列 · 三千年</div>

<!-- 右上控制按钮 -->
<nav id="zoomCtl" aria-label="画布控制">
  <button data-act="up"    title="上移 ↑">↑</button>
  <button data-act="left"  title="左移 ←">←</button>
  <button data-act="right" title="右移 →">→</button>
  <button data-act="down"  title="下移 ↓">↓</button>
  <button data-act="in"    title="放大 +">+</button>
  <button data-act="out"   title="缩小 −">−</button>
  <button data-act="fit"   title="回到全景 0">⤢</button>
</nav>

<!-- 左侧档案面板 -->
<aside id="panel">
  <button id="panelToggle" aria-label="收起/展开面板">⌄</button>
  <div class="panel-inner">
    <div class="panel-title">检索档案<span>SEARCH THE FIELD</span></div>
    <div class="search-box">
      <input id="search" type="text" placeholder="搜索条目、地名、标签…" autocomplete="off">
      <span class="search-glyph">⌕</span>
    </div>
    <div id="activeFilter"></div>

    <div class="chip-group">
      <div class="chip-label">展厅 <em>HALLS</em></div>
      <div class="chips" id="hallChips"></div>
    </div>
    <div class="chip-group">
      <div class="chip-label">系列 <em>COLLECTIONS</em></div>
      <div class="chips" id="archiveChips"></div>
    </div>
    <div class="chip-group">
      <div class="chip-label">专题 <em>THEMES</em></div>
      <div class="chips" id="themeChips"></div>
    </div>

    <div id="resultCount"></div>

    <a id="guideLink" href="../田策展/田主题策展分类方案.md" target="_blank" rel="noopener">
      阅读完整策展分类方案：田主题策展分类方案 »
    </a>
  </div>
</aside>

<!-- 底部导览按钮 -->
<button id="guideBtn">开启导览<span>SHOW GUIDE</span></button>

<!-- 导览卡片 -->
<div id="guideCard" class="hidden">
  <div class="guide-progress" id="guideDots"></div>
  <h2 id="guideTitle"></h2>
  <p id="guideBody"></p>
  <div class="guide-nav">
    <button id="guidePrev">← 上一站</button>
    <button id="guideNext">下一站 →</button>
    <button id="guideDone" class="hidden">明白了！Got it!</button>
  </div>
  <button id="guideClose" aria-label="退出导览">✕</button>
</div>

<!-- 详情视图 -->
<section id="detail" class="hidden">
  <button id="detailBack" aria-label="返回田野">←<span>返回田野</span></button>

  <div class="detail-layout">
    <aside class="detail-info">
      <div class="detail-era" id="dEra">—</div>
      <h2 class="detail-title" id="dTitle">—</h2>
      <div class="detail-source" id="dSource">—</div>
      <div class="detail-banner" id="dBanner">—</div>
      <div class="detail-defs">
        <div class="defs-title">释义 <em>GENERATED BY AI</em></div>
        <p id="dNote"></p>
        <div class="defs-tags" id="dTags"></div>
      </div>
      <a class="detail-ext" id="dExt" href="#" target="_blank" rel="noopener">在档案来源处查看原件 ↗</a>
    </aside>

    <div class="detail-stage">
      <div class="stage-frame" id="stageFrame">
        <img id="dImg" alt="" draggable="false">
        <div class="stage-quote" id="dQuote"></div>
        <div class="stage-zoom">
          <button data-z="in">+</button>
          <button data-z="out">−</button>
          <button data-z="fit">⤢</button>
        </div>
        <div class="stage-hint">滚轮缩放 · 拖拽平移</div>
      </div>
    </div>
  </div>

  <button id="another">再看一丘<span>SEE ANOTHER PLOT</span></button>
</section>

<!-- 画布底部提示 -->
<div id="hint">滚轮缩放 · 拖拽平移 · 点击任意档案查看详情</div>

<script src="data/archives.js"></script>
<script src="js/app.js"></script>
</body>
</html>
